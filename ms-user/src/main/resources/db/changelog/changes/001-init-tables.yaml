databaseChangeLog:
  # =======================
  # user_profiles
  # =======================
  - changeSet:
      id: 001-create-user-profiles
      author: imran
      changes:
        - createTable:
            tableName: user_profiles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(50)
              - column:
                  name: last_name
                  type: VARCHAR(50)
              - column:
                  name: birth_date
                  type: DATE
              - column:
                  name: email
                  type: VARCHAR(100)
              - column:
                  name: role_id
                  type: INTEGER

  # =======================
  # roles
  # =======================
  - changeSet:
      id: 002-create-roles
      author: imran
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)

  # =======================
  # api_endpoints
  # =======================
  - changeSet:
      id: 003-create-api-endpoints
      author: imran
      changes:
        - createTable:
            tableName: api_endpoints
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: path
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: http_method
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: is_public
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: is_disabled
                  type: BOOLEAN
                  defaultValueBoolean: false

  # =======================
  # role_api_permissions
  # =======================
  - changeSet:
      id: 004-create-role-api-permissions
      author: imran
      changes:
        - createTable:
            tableName: role_api_permissions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: api_endpoint_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: role_api_permissions
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_role_permissions_role
        - addForeignKeyConstraint:
            baseTableName: role_api_permissions
            baseColumnNames: api_endpoint_id
            referencedTableName: api_endpoints
            referencedColumnNames: id
            constraintName: fk_role_permissions_api
