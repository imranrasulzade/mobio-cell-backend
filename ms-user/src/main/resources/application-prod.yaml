spring:
  application:
    name: ms-user
  datasource:
    url: jdbc:postgresql://ms-postgres:5432/ms_user
    username: ms_user
    password: ms_user

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none

application:
  security:
    internal-key: ${internal_service_key:mobio-local-internal-key}
