spring:
  application:
    name: ms-notification
  datasource:
    url: jdbc:postgresql://localhost:5434/ms_notification
    username: ms_notification
    password: ms_notification

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false

application:
  security:
    internal-key: mobio-local-internal-key

server:
  port: 8087
