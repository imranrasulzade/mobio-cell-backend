spring:
  application:
    name: ms-package
  datasource:
    url: jdbc:postgresql://ms-postgres:5432/ms_package
    username: ms_package
    password: ms_package

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false

application:
  security:
    internal-key: ${internal_service_key:mobio-local-internal-key}
