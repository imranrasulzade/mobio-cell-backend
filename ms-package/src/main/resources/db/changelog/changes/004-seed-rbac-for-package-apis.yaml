databaseChangeLog:
  - changeSet:
      id: 005-seed-rbac-for-package-apis
      author: codex
      changes:
        - sql:
            sql: |
              INSERT INTO roles (name, description)
              SELECT 'ADMIN', 'System administrator'
              WHERE NOT EXISTS (SELECT 1 FROM roles WHERE name = 'ADMIN');

              INSERT INTO roles (name, description)
              SELECT 'USER', 'Regular user'
              WHERE NOT EXISTS (SELECT 1 FROM roles WHERE name = 'USER');

              INSERT INTO api_endpoints (path, http_method, is_public, is_disabled)
              SELECT '/api/package', 'POST', false, false
              WHERE NOT EXISTS (SELECT 1 FROM api_endpoints WHERE path = '/api/package' AND http_method = 'POST');

              INSERT INTO api_endpoints (path, http_method, is_public, is_disabled)
              SELECT '/api/package/{id}', 'PUT', false, false
              WHERE NOT EXISTS (SELECT 1 FROM api_endpoints WHERE path = '/api/package/{id}' AND http_method = 'PUT');

              INSERT INTO api_endpoints (path, http_method, is_public, is_disabled)
              SELECT '/api/package/{id}', 'DELETE', false, false
              WHERE NOT EXISTS (SELECT 1 FROM api_endpoints WHERE path = '/api/package/{id}' AND http_method = 'DELETE');

              INSERT INTO api_endpoints (path, http_method, is_public, is_disabled)
              SELECT '/api/package/{id}', 'GET', false, false
              WHERE NOT EXISTS (SELECT 1 FROM api_endpoints WHERE path = '/api/package/{id}' AND http_method = 'GET');

              INSERT INTO api_endpoints (path, http_method, is_public, is_disabled)
              SELECT '/api/package', 'GET', false, false
              WHERE NOT EXISTS (SELECT 1 FROM api_endpoints WHERE path = '/api/package' AND http_method = 'GET');

              INSERT INTO api_endpoints (path, http_method, is_public, is_disabled)
              SELECT '/api/package/active/by-number/{numberId}', 'GET', false, false
              WHERE NOT EXISTS (SELECT 1 FROM api_endpoints WHERE path = '/api/package/active/by-number/{numberId}' AND http_method = 'GET');

              INSERT INTO role_api_permissions (role_id, api_endpoint_id)
              SELECT r.id, e.id FROM roles r JOIN api_endpoints e ON e.path = '/api/package' AND e.http_method = 'POST'
              WHERE r.name = 'ADMIN'
              AND NOT EXISTS (SELECT 1 FROM role_api_permissions rap WHERE rap.role_id = r.id AND rap.api_endpoint_id = e.id);

              INSERT INTO role_api_permissions (role_id, api_endpoint_id)
              SELECT r.id, e.id FROM roles r JOIN api_endpoints e ON e.path = '/api/package/{id}' AND e.http_method = 'PUT'
              WHERE r.name = 'ADMIN'
              AND NOT EXISTS (SELECT 1 FROM role_api_permissions rap WHERE rap.role_id = r.id AND rap.api_endpoint_id = e.id);

              INSERT INTO role_api_permissions (role_id, api_endpoint_id)
              SELECT r.id, e.id FROM roles r JOIN api_endpoints e ON e.path = '/api/package/{id}' AND e.http_method = 'DELETE'
              WHERE r.name = 'ADMIN'
              AND NOT EXISTS (SELECT 1 FROM role_api_permissions rap WHERE rap.role_id = r.id AND rap.api_endpoint_id = e.id);

              INSERT INTO role_api_permissions (role_id, api_endpoint_id)
              SELECT r.id, e.id FROM roles r JOIN api_endpoints e ON e.path = '/api/package/{id}' AND e.http_method = 'GET'
              WHERE r.name IN ('ADMIN', 'USER')
              AND NOT EXISTS (SELECT 1 FROM role_api_permissions rap WHERE rap.role_id = r.id AND rap.api_endpoint_id = e.id);

              INSERT INTO role_api_permissions (role_id, api_endpoint_id)
              SELECT r.id, e.id FROM roles r JOIN api_endpoints e ON e.path = '/api/package' AND e.http_method = 'GET'
              WHERE r.name IN ('ADMIN', 'USER')
              AND NOT EXISTS (SELECT 1 FROM role_api_permissions rap WHERE rap.role_id = r.id AND rap.api_endpoint_id = e.id);

              INSERT INTO role_api_permissions (role_id, api_endpoint_id)
              SELECT r.id, e.id FROM roles r JOIN api_endpoints e ON e.path = '/api/package/active/by-number/{numberId}' AND e.http_method = 'GET'
              WHERE r.name IN ('ADMIN', 'USER')
              AND NOT EXISTS (SELECT 1 FROM role_api_permissions rap WHERE rap.role_id = r.id AND rap.api_endpoint_id = e.id);
