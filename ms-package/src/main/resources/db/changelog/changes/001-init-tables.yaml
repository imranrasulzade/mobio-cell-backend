databaseChangeLog:
  # =======================
  # packages
  # =======================
  - changeSet:
      id: 001-create-packages
      author: imran
      changes:
        - createTable:
            tableName: packages
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: validity_days
                  type: INTEGER
                  constraints:
                    nullable: false

  # =======================
  # numbers_packages
  # =======================
  - changeSet:
      id: 002-create-numbers-packages
      author: imran
      changes:
        - createTable:
            tableName: numbers_packages
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: phone_number_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: package_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: activated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: expires_at
                  type: TIMESTAMP
              - column:
                  name: join_at
                  type: TIMESTAMP
              - column:
                  name: is_active
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: status
                  type: INTEGER
        - addForeignKeyConstraint:
            baseTableName: numbers_packages
            baseColumnNames: package_id
            referencedTableName: packages
            referencedColumnNames: id
            constraintName: fk_numbers_packages_package

  # =======================
  # roles
  # =======================
  - changeSet:
      id: 003-create-roles
      author: imran
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)

  # =======================
  # api_endpoints
  # =======================
  - changeSet:
      id: 004-create-api-endpoints
      author: imran
      changes:
        - createTable:
            tableName: api_endpoints
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: path
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: http_method
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: is_public
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: is_disabled
                  type: BOOLEAN
                  defaultValueBoolean: false

  # =======================
  # role_api_permissions
  # =======================
  - changeSet:
      id: 005-create-role-api-permissions
      author: imran
      changes:
        - createTable:
            tableName: role_api_permissions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: api_endpoint_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: role_api_permissions
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_role_permissions_role
        - addForeignKeyConstraint:
            baseTableName: role_api_permissions
            baseColumnNames: api_endpoint_id
            referencedTableName: api_endpoints
            referencedColumnNames: id
            constraintName: fk_role_permissions_api
